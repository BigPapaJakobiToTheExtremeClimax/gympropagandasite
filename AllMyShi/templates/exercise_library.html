{% extends "base.html" %}
{% block content %}
<div class="form-container">
    <h2>Exercise Library</h2>
    <p>Select an exercise to view the form demonstration.</p>
</div>

<div class="exercise-list">
    {% for id, name, gif in exercises %}
        <div class="exercise-item">
            <a href="#" onclick="openGifPopup('{{ gif }}')">{{ name }}</a>
        </div>
    {% endfor %}
</div>

<!-- Popup -->
<div id="gif-popup" class="gif-popup">
    <div class="gif-popup-content">
        <span class="close-btn" onclick="closeGifPopup()">&times;</span>
        <img id="gif-image" src="" alt="Exercise GIF">
    </div>
</div>

<script>
function openGifPopup(gifPath) {
    document.getElementById("gif-image").src = "/" + gifPath;
    document.getElementById("gif-popup").style.display = "flex";
}

function closeGifPopup() {
    document.getElementById("gif-popup").style.display = "none";
}
</script>
{% endblock %}
