{% extends "base.html" %}
{% block content %}
<div class="form-container">
    <h2>Legs Day</h2>
    <p>Enter your sets, reps, and weight for each exercise.</p>

    <div class="workout-template">

        <!-- Leg Extensions -->
        <div class="exercise-card">
            <h3>Leg Extensions</h3>
            <div class="set-row">
                <label>Set:</label>
                <input type="number" placeholder="Reps">
                <input type="number" placeholder="Weight (kg)">
                <button type="button" class="done-btn" onclick="markDone(this)">Done</button>
            </div>
            <div class="set-row">
                <label>Set:</label>
                <input type="number" placeholder="Reps">
                <input type="number" placeholder="Weight (kg)">
                <button type="button" class="done-btn" onclick="markDone(this)">Done</button>

            </div>
        </div>
        <!-- Lying Hamstring Curls -->
        <div class="exercise-card">
            <h3>Lying Hamstring Curls</h3>
            <div class="set-row">
                <label>Set:</label>
                <input type="number" placeholder="Reps">
                <input type="number" placeholder="Weight (kg)">
                <button type="button" class="done-btn" onclick="markDone(this)">Done</button>
            </div>
            <div class="set-row">
                <label>Set:</label>
                <input type="number" placeholder="Reps">
                <input type="number" placeholder="Weight (kg)">
                <button type="button" class="done-btn" onclick="markDone(this)">Done</button>

            </div>
        </div>
        <!-- Barbell Squat -->
        <div class="exercise-card">
            <h3>Barbell Squat</h3>
            <div class="set-row">
                <label>Set:</label>
                <input type="number" placeholder="Reps">
                <input type="number" placeholder="Weight (kg)">
                <button type="button" class="done-btn" onclick="markDone(this)">Done</button>
            </div>
            <div class="set-row">
                <label>Set:</label>
                <input type="number" placeholder="Reps">
                <input type="number" placeholder="Weight (kg)">
                <button type="button" class="done-btn" onclick="markDone(this)">Done</button>

            </div>
        </div>
        <!-- Standing Calf Raises (Machine) -->
        <div class="exercise-card">
            <h3>Standing Calf Raises (Machines)</h3>
            <div class="set-row">
                <label>Set:</label>
                <input type="number" placeholder="Reps">
                <input type="number" placeholder="Weight (kg)">
                <button type="button" class="done-btn" onclick="markDone(this)">Done</button>
            </div>
            <div class="set-row">
                <label>Set:</label>
                <input type="number" placeholder="Reps">
                <input type="number" placeholder="Weight (kg)">
                <button type="button" class="done-btn" onclick="markDone(this)">Done</button>

            </div>
        </div>
        <!-- Weighted Decline Crunches -->
        <div class="exercise-card">
            <h3>Weighted Decline Crunches</h3>
            <div class="set-row">
                <label>Set:</label>
                <input type="number" placeholder="Reps">
                <input type="number" placeholder="Weight (kg)">
                <button type="button" class="done-btn" onclick="markDone(this)">Done</button>
            </div>
            <div class="set-row">
                <label>Set:</label>
                <input type="number" placeholder="Reps">
                <input type="number" placeholder="Weight (kg)">
                <button type="button" class="done-btn" onclick="markDone(this)">Done</button>
    </div>
</div>

<form method="POST" action="{{ url_for('main.save_workout') }}">
    <input type="hidden" name="template_name" value="Legs">
    <button type="submit" class="template-btn">Save Workout</button>
</form>
{% endblock %}
